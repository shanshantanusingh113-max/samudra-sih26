name: Deploy to GitHub Pages

# The demo is a static site: the ocean data is baked into web/public/data at build time, so
# there is nothing to run server-side and nothing to configure. See docs/adr/0003.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npx vite build

      - name: Check the baked data actually shipped
        working-directory: web
        # A silently empty dist/data would deploy a site that loads and then fails, which is
        # worse than failing here.
        run: |
          test -f dist/data/manifest.json
          test -f dist/data/floats.json
          ls dist/data/volumes/*.bin >/dev/null
          echo "data present: $(du -sh dist/data | cut -f1)"

      - name: Check nothing reaches out over the network
        working-directory: web
        # The demo must survive a dead venue network. This was quietly false once: all three
        # pages linked Google Fonts while the README carried a badge saying otherwise, so the
        # typefaces are served from the build and the check is here rather than in a comment.
        run: |
          ls dist/fonts/*.woff2 >/dev/null
          test -f dist/fonts.css
          # A URL, not a mention: the pages carry comments naming the host they no longer use.
          ! grep -rqE "(https?:)?//(fonts\.(googleapis|gstatic)\.com|cdn\.jsdelivr\.net|unpkg\.com)" dist/*.html dist/assets dist/fonts.css
          echo "no external font or CDN references in the build"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
